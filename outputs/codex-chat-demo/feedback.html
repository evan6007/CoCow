<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="demo-token" content="__TOKEN__"><title>CoCow · 回報工作台</title><link rel="stylesheet" href="/feedback.css"></head><body><aside class="app-rail"><a class="rail-brand" href="/">◈ CoCow</a><a href="/">⌂　工作台</a><a class="active" href="/feedback">▤　問題與回報</a><div class="rail-bottom">背景巡查持續處理<br><span>關閉頁面也能追蹤進度</span></div></aside><header class="topbar"><a class="brand" href="/">CoCow <span>／ 回報工作台</span></a><div class="top-actions"><span id="role" class="pill">連線中</span><button id="refresh" title="重新整理">↻</button><button id="new" class="primary">＋ 新增回報</button></div></header><main><section class="intro"><div><p class="eyebrow">FEEDBACK</p><h1>問題與回報</h1><p class="muted" id="hint">留下問題、附上畫面，在這裡追蹤進度。</p></div><div class="stats"><div><strong id="total">—</strong><span>全部回報</span></div><div><strong id="chosen">—</strong><span>待處理</span></div><div><strong id="done">—</strong><span>已完成</span></div></div></section><div class="toolbar"><div class="tabs"><button class="active" id="all">全部</button><button id="mine">我的回報</button></div><input type="search" id="search" placeholder="搜尋內容或回報者…" aria-label="搜尋回報"><span class="muted" id="count"></span></div><p id="status" role="status" aria-live="polite"></p><div id="board" class="board"></div><p class="footnote">「處理中」不代表正在執行；AI 問答狀態另列。發布修正總結後 3 天未回應自動完成。回覆仍有問題會回到待處理。</p></main><dialog id="composer"><form method="dialog" class="dialog-head"><div><p class="eyebrow">你的使用體驗很重要</p><h2>新增回報</h2></div><button aria-label="關閉">×</button></form><div class="dialog-body"><label class="field-label" for="text">發生什麼事？</label><label class="field-label">可見範圍 <select id="visibility"><option value="shared">已核准成員可查看、回覆與驗收</option><option value="private">只有提出者與管理者</option></select></label><textarea id="text" maxlength="16000" placeholder="例如：切換聊天室後，剛才輸入的文字不見了。
也可以描述你希望它怎麼運作。"></textarea><label id="dropzone" class="dropzone" tabindex="0"><strong>＋ 加入畫面</strong><span>拖曳圖片到這裡、點擊選取，或直接 Ctrl＋V</span><small>PNG、JPEG、WebP · 每張 5 MB · 最多 6 張</small><input hidden id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="previews"></div><p id="compose-status" role="status"></p></div><footer class="dialog-footer"><span class="muted">請勿在共享回報放入密碼或私人資料</span><button id="submit" class="primary">送出回報 ↗</button></footer></dialog><dialog id="detail"><form method="dialog" class="dialog-head"><div><p class="eyebrow">問題討論 · AI QA</p><h2>回報詳情</h2></div><button class="close-button" aria-label="關閉回報">✕ 關閉</button></form><div id="detail-body" class="dialog-body"></div></dialog><script type="module" src="/feedback-ui.js"></script></body></html>
