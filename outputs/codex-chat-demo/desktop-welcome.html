<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>開啟CoCow</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1d1f;color:#f5f5f5;font:17px/1.8 'Segoe UI','Microsoft JhengHei UI',sans-serif}main{width:min(100% - 40px,580px);padding:40px 0}header{font-size:17px;color:#aaa;margin-bottom:52px}h1{font-size:30px;line-height:1.4;margin:0 0 16px}p{color:#b8b8be;margin:0 0 26px}.actions{display:flex;gap:12px;flex-wrap:wrap}button,.button{font:inherit;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:8px 24px;border:1px solid #53545a;border-radius:10px;cursor:pointer;background:#f0f0f2;color:#202124;text-decoration:none}button:disabled{opacity:.55;cursor:wait}.secondary{background:transparent;color:#ddd}details{margin-top:40px;border-top:1px solid #35363b;padding-top:20px;color:#aaa;font-size:15px}summary{cursor:pointer}dl{display:grid;grid-template-columns:85px 1fr;gap:12px 20px}dt{color:#aaa}dd{margin:0;overflow-wrap:anywhere;color:#ddd}a{color:#d8e6fa;text-underline-offset:4px}small{display:block;margin-top:22px;color:#93949b;font-size:14px}[hidden]{display:none!important}:focus-visible{outline:2px solid #acbede;outline-offset:5px}@media(max-width:500px){h1{font-size:26px}.actions>*{width:100%}}
progress{display:block;width:100%;height:7px;accent-color:#a3cbb8;margin:14px 0 30px}.update-line{font-size:14px;color:#ccc}
</style></head><body><main><header>CoCow</header><h1 id="title">正在準備</h1><p id="message">紀錄會自動保存在這台電腦。</p><div id="update-display" hidden><div class="update-line" id="update-label" role="status"></div><progress id="update-progress" max="100" aria-label="啟動與更新進度"></progress></div><div class="actions"><button id="start">檢查並開啟</button><a id="open" class="button" hidden>進入CoCow</a><a id="connect" class="button secondary" href="https://tailscale.com/download" target="_blank" rel="noreferrer" hidden>設定私人連線</a></div><small id="notice">不需要搬資料夾，也不需要另外安裝 Node.js。</small><details><summary>詳細資訊</summary><dl><dt>電腦</dt><dd id="computer"></dd><dt>紀錄位置</dt><dd id="data"></dd></dl><p>切換電腦或複製舊紀錄，可在CoCow的主機選單操作。既有手動安裝的紀錄不會被搬動或覆蓋。</p><p><a href="https://workbench-install-guide.evan6007.chatgpt.site" target="_blank" rel="noreferrer">查看連線教學</a></p><button id="stop" class="secondary" hidden>停止CoCow</button></details></main><script nonce="__DESKTOP_TOKEN__">
const headers={'x-workbench-desktop':'__DESKTOP_TOKEN__'},$=id=>document.getElementById(id);let opening=false,redirected=false;
function render(s){const p=s.progress;$('update-display').hidden=!(p&&(s.busy||s.updateBusy||!s.serviceOrigin));if(p){$('update-label').textContent=p.label+(Number.isFinite(p.percent)?' · '+p.percent+'%':'');if(Number.isFinite(p.percent))$('update-progress').value=p.percent;else $('update-progress').removeAttribute('value');}$('title').textContent=s.title;$('message').textContent=s.message;$('computer').textContent=s.computer;$('data').textContent=s.dataPath;$('start').disabled=opening||s.busy;$('start').hidden=!!s.serviceOrigin;$('open').hidden=!s.serviceOrigin;$('stop').hidden=!s.serviceOrigin;$('connect').hidden=!['network','denied'].includes(s.stage);if(s.serviceOrigin){$('open').href=s.serviceOrigin+'/#desktop-local';if(!redirected){redirected=true;location.replace($('open').href);}}}
async function request(path,method='GET'){const response=await fetch(path,{method,headers});if(!response.ok)throw new Error('請從桌面捷徑重新開啟CoCow。');return response.json();}
async function start(){if(opening)return;opening=true;$('start').disabled=true;$('title').textContent='正在確認連線';try{render(await request('/start','POST'));}catch(e){$('message').textContent=e.message;}finally{opening=false;$('start').disabled=false;}}
setInterval(()=>{if(opening)request('/status').then(render).catch(()=>{});},500);
$('start').onclick=start;$('stop').onclick=async()=>{if(confirm('停止這台CoCow？進行中的回答或工作也會中斷，紀錄會保留。'))render(await request('/stop','POST'));};
request('/status').then(s=>{render(s);if(!s.serviceOrigin)start();}).catch(e=>$('message').textContent=e.message);
</script></body></html>
